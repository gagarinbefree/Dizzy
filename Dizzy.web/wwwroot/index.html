<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dizzy</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#000000">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="shortcut icon" href="favicon.ico">
    <!-- Start the big downloads before godot.js even runs; the dotnet.* files
         are otherwise only discovered mid-boot. -->
    <script>
        // Opt-in: fetch the .gz siblings the 2dog publish writes (engine, pack
        // and _framework binaries) and inflate them in the page. For hosts that
        // serve everything uncompressed. Publishing with
        // TwoDogWebPrecompressKeepOriginals=false switches it on in the app
        // bundle. A host that already content-encodes would compress them a
        // second time.
        const TWODOG_PCK_GZ = false;
        // The hints must name the files the engine fetches, or both download.
        const twodogGz = TWODOG_PCK_GZ && typeof DecompressionStream !== 'undefined';
        async function loadEngine() {
            const home = new URL(location.href);
            if (home.searchParams.has('_dizzy_home')) {
                home.searchParams.delete('_dizzy_home');
                history.replaceState(history.state, '', home);
            }
            const pointer = new URL('version.json', location.href);
            pointer.searchParams.set('t', Date.now());
            const response = await fetch(pointer, { cache: 'no-store' });
            if (!response.ok) throw new Error('Could not load the game version.');
            const { build } = await response.json();
            if (build !== undefined) {
                if (!/^\d+-\d+$/.test(build)) throw new Error('Invalid game build.');
                const manifest = document.querySelector('link[rel="manifest"]');
                manifest.href = new URL('manifest.webmanifest', home).href;
                const base = document.createElement('base');
                base.href = new URL('builds/' + build + '/', location.href).href;
                document.head.prepend(base);
            }
            for (const file of ['godot.wasm', 'godot.pck']) {
                const hint = document.createElement('link');
                hint.rel = 'preload';
                hint.as = 'fetch';
                hint.crossOrigin = 'anonymous';
                hint.href = twodogGz ? file + '.gz' : file;
                document.head.appendChild(hint);
            }
            for (const file of ['dotnet.js', 'dotnet.boot.js', 'dotnet.runtime.js', 'dotnet.native.js']) {
                const hint = document.createElement('link');
                hint.rel = 'modulepreload';
                hint.href = '_framework/' + file;
                document.head.appendChild(hint);
            }
            await new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = 'godot.js';
                script.onload = resolve;
                script.onerror = () => reject(new Error('Could not load the game engine.'));
                document.head.appendChild(script);
            });
        }
    </script>
    <style>
        html,
        body,
        #canvas {
            margin: 0;
            padding: 0;
            border: 0;
        }

        body {
            color: white;
            background-color: black;
            overflow: hidden;
            touch-action: none;
        }

        #canvas {
            display: block;
        }

        #canvas:focus {
            outline: none;
        }

        /* Painted above #status (which JavaScript would otherwise remove) so
           the message is visible when scripts are disabled. */
        noscript {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #242424;
            font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
        }

        #status {
            position: fixed;
            inset: 0;
            background-color: black;
            display: grid;
            place-items: center;
        }

        #status-artwork {
            grid-area: 1 / 1;
            position: relative;
            width: min(100%, calc(100vh * 8 / 5));
            width: min(100%, calc(100dvh * 8 / 5));
        }

        #status-splash {
            display: block;
            width: 100%;
            height: auto;
            image-rendering: pixelated;
        }

        #enable-music {
            position: absolute;
            right: 0.75rem;
            top: 0.75rem;
        }

        #enable-music[hidden] { display: none; }

        #status-bar {
            position: absolute;
            left: 50%;
            bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            width: min(60%, 320px);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            background-color: #4a4a4a;
            box-shadow: 0 0 0 1px black;
        }

        /* Kept for screen readers, which announce an indeterminate progress as busy. */
        #status-progress {
            position: absolute;
            inset: 0;
            opacity: 0;
        }

        /* Engine startup blocks the page for seconds, freezing a native progress bar;
           a transform animation runs on the compositor and keeps moving. */
        #status-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            width: 30%;
            background-color: #e0e0e0;
            animation: status-busy 1.2s ease-in-out infinite;
        }

        @keyframes status-busy {
            from {
                transform: translateX(-100%);
            }

            to {
                transform: translateX(340%);
            }
        }

        #status-notice {
            grid-area: 1 / 1;
            background-color: #5b3943;
            border-radius: 0.5rem;
            border: 1px solid #9b3943;
            color: #e0e0e0;
            font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
            line-height: 1.3;
            margin: 0 2rem;
            overflow: hidden;
            padding: 1rem;
            text-align: center;
            /* Failure notices carry meaningful newlines (missing-feature lists). */
            white-space: pre-line;
            z-index: 1;
            display: none;
        }
    </style>
</head>

<body>
    <canvas id="canvas">
        Your browser does not support the canvas tag.
    </canvas>

    <noscript>
        Your browser does not support JavaScript.
    </noscript>

    <div id="status">
        <div id="status-artwork">
            <img id="status-splash" src="load.png" width="512" height="320" alt="Dizzy looking across the valley towards Zaks’s castle">
            <button id="enable-music" type="button" class="btn btn-neutral btn-sm" hidden>Play music</button>
            <div id="status-bar"><progress id="status-progress" aria-label="Loading progress"></progress></div>
        </div>
        <div id="status-notice" class="alert" role="alert"></div>
    </div>

    <script>
        const GODOT_CONFIG = {
            'args': [],
            'canvasResizePolicy': 2,
            'ensureCrossOriginIsolationHeaders': false,
            'executable': 'godot',
            'experimentalVK': false,
            'focusCanvas': true,
            'gdextensionLibs': []
        };
        const GODOT_THREADS_ENABLED = false;

        (async function () {
            performance.mark('2dog:boot');

            const statusOverlay = document.getElementById('status');
            const statusBar = document.getElementById('status-bar');
            const statusNotice = document.getElementById('status-notice');
            const musicButton = document.getElementById('enable-music');
            const loadingMusic = new Audio();
            loadingMusic.loop = true;
            loadingMusic.volume = 10 ** (-8 / 20); // Match the title player's volume in Godot.
            loadingMusic.src = new URL('0-title.wav', location.href).href;

            async function playLoadingMusic() {
                try {
                    await loadingMusic.play();
                    musicButton.hidden = true;
                } catch (error) {
                    musicButton.hidden = error.name !== 'NotAllowedError' || !loadingMusic.hasAttribute('src');
                }
            }

            function finishLoadingMusic() {
                if (!loadingMusic.hasAttribute('src')) return 0;
                const position = loadingMusic.currentTime;
                loadingMusic.pause();
                loadingMusic.removeAttribute('src');
                loadingMusic.load();
                musicButton.hidden = true;
                statusOverlay.removeEventListener('click', playLoadingMusic);
                delete window.dizzyLoadingMusic;
                return position;
            }

            window.dizzyLoadingMusic = { finish: finishLoadingMusic };
            statusOverlay.addEventListener('click', playLoadingMusic);
            playLoadingMusic();

            let initializing = true;
            let statusMode = '';

            function setStatusMode(mode) {
                if (statusMode === mode || !initializing) {
                    return;
                }
                if (mode === 'hidden') {
                    finishLoadingMusic();
                    statusOverlay.remove();
                    initializing = false;
                    return;
                }
                statusBar.style.display = mode === 'progress' ? 'block' : 'none';
                statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
                statusMode = mode;
            }

            function displayFailureNotice(err) {
                finishLoadingMusic();
                console.error(err);
                statusNotice.textContent = typeof err?.message === 'string' ? err.message : String(err);
                setStatusMode('notice');
                initializing = false;
            }

            let downloadsDone = false;

            function reportProgress(current, total) {
                if (!downloadsDone && total > 0 && current >= total) {
                    downloadsDone = true;
                    performance.mark('2dog:downloads-done');
                }
            }

            // The gz pack path re-points this at a merged reporter.
            let engineProgress = reportProgress;

            function startWithGzPack(fileSizes, makeEngine) {
                // A rejected probe (network error, service worker failure)
                // falls back to the uncompressed pack exactly like a 404.
                return fetch('godot.pck.gz').catch(() => null).then((response) => {
                    if (!response || !response.ok || !response.body) {
                        console.warn('2dog: godot.pck.gz unavailable, falling back to godot.pck');
                        return makeEngine('').startGame({});
                    }
                    const engine = makeEngine('.gz');
                    // The engine only downloads the wasm here; this page fetches
                    // and inflates the pack, merging both into one download
                    // timing (compressed pack bytes against its Content-Length).
                    let pckLoaded = 0;
                    let wasmLoaded = 0;
                    let wasmTotal = fileSizes['godot.wasm'] || 0;
                    const pckTotal = Number(response.headers.get('Content-Length')) || 0;
                    const report = () => reportProgress(wasmLoaded + pckLoaded,
                        wasmTotal > 0 && pckTotal > 0 ? wasmTotal + pckTotal : 0);
                    engineProgress = (current, total) => {
                        wasmLoaded = current;
                        if (total > 0) wasmTotal = total;
                        report();
                    };
                    const counted = new TransformStream({
                        transform(chunk, controller) {
                            pckLoaded += chunk.byteLength;
                            report();
                            controller.enqueue(chunk);
                        },
                    });
                    const pack = new Response(
                        response.body.pipeThrough(counted).pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
                    return Promise.all([
                        engine.init(GODOT_CONFIG['executable']),
                        pack.then((buffer) => engine.preloadFile(buffer, 'godot.pck')),
                    ]).then(() => engine.start({ 'args': ['--main-pack', 'godot.pck'].concat(GODOT_CONFIG['args']) }));
                });
            }

            function reportTimings() {
                performance.mark('2dog:first-frame');
                const total = performance.measure('2dog:total', '2dog:boot', '2dog:first-frame').duration;
                let text = '2dog: first frame ' + Math.round(total) + ' ms after boot';
                if (downloadsDone) {
                    const tail = performance.measure('2dog:tail', '2dog:downloads-done', '2dog:first-frame').duration;
                    text += ' (' + Math.round(total - tail) + ' ms downloading, ' + Math.round(tail) + ' ms starting)';
                }
                console.log(text);
                // Detail table on demand (?2dog-timing). transferSize reads 0
                // for memory-cache hits - measure with caching disabled.
                if (!new URLSearchParams(location.search).has('2dog-timing')) {
                    return;
                }
                const rows = performance.getEntriesByType('resource')
                    .filter((entry) => entry.transferSize > 100000)
                    .sort((a, b) => b.transferSize - a.transferSize)
                    .map((entry) => ({
                        file: entry.name.replace(/.*\//, ''),
                        'wire kB': Math.round(entry.transferSize / 1000),
                        ms: Math.round(entry.duration),
                    }));
                if (rows.length) console.table(rows);
            }

            try {
                await loadEngine();
            } catch (error) {
                displayFailureNotice(error);
                return;
            }
            const missing = Engine.getMissingFeatures({
                threads: GODOT_THREADS_ENABLED,
                renderingDriver: GODOT_CONFIG['renderingDriver'],
            });

            if (missing.length !== 0) {
                const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
                displayFailureNotice(missingMsg + missing.join('\n'));
                return;
            }

            // Exact sizes written by the publish split the first-frame timing
            // into downloading and starting (Content-Length is the compressed
            // size on hosts that gzip, so headers lie).
            fetch('twodog.sizes.json')
                .then((response) => (response.ok ? response.json() : {}))
                .catch(() => ({}))
                .then((fileSizes) => {
                    // The suffix decides which files the engine fetches, so
                    // the Engine is only constructed after the pack probe has
                    // picked a path - a '.gz'-configured engine in the
                    // fallback would re-request the sibling that just 404'd.
                    const makeEngine = (suffix) => {
                        GODOT_CONFIG['fileSizes'] = fileSizes;
                        GODOT_CONFIG['onProgress'] = (current, total) => engineProgress(current, total);
                        // Newer engines also inflate .gz siblings themselves
                        // (godot.wasm.gz included); older ones ignore this key.
                        GODOT_CONFIG['precompressedSuffix'] = suffix;
                        return new Engine(GODOT_CONFIG);
                    };
                    setStatusMode('progress');
                    const started = twodogGz
                        ? startWithGzPack(fileSizes, makeEngine)
                        : makeEngine('').startGame({});
                    return started.then(() => {
                        reportTimings();
                        setStatusMode('hidden');
                    }, displayFailureNotice);
                })
                .catch(displayFailureNotice);
        }());
    </script>
</body>

</html>
