name: Test and deploy web game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: 4.7.2-stable

jobs:
  godot-tests:
    name: Test Godot startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Get Godot .NET for Linux
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          ARCHIVE="Godot_v${GODOT_RELEASE}_mono_linux_x86_64.zip"
          gh release download "$GODOT_RELEASE" --repo godotengine/godot-builds --pattern "$ARCHIVE" --dir "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot/$ARCHIVE" -d "$RUNNER_TEMP/godot"
          GODOT="$(find "$RUNNER_TEMP/godot" -type f -name 'Godot*linux.x86_64' -print -quit)"
          test -n "$GODOT"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
      - name: Compile and start a clean project
        shell: bash
        run: |
          dotnet build Dizzy.csproj --configuration Debug
          dotnet build Tests/KernelChecks.csproj --configuration Debug
          "$GODOT" --headless --path . --editor --import
          "$GODOT" --headless --path . --quit-after 30 2>&1 | tee "$RUNNER_TEMP/dizzy-startup.log"
          grep -F DIZZY_TITLE_READY "$RUNNER_TEMP/dizzy-startup.log"
          if grep -F 'ERROR:' "$RUNNER_TEMP/dizzy-startup.log"; then exit 1; fi

  browser:
    name: Build and test Web/PWA
    needs: godot-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache the Dizzy 2D web engine
        id: web-engine
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/dizzy-web-engine
          key: web-engine-emsdk-3.1.56-${{ hashFiles('tools/build_web_engine.sh', 'Directory.Build.props') }}
      - uses: emscripten-core/setup-emsdk@v16
        if: steps.web-engine.outputs.cache-hit != 'true'
        with:
          version: 3.1.56
      - name: Compile the single-threaded 2D web engine
        if: steps.web-engine.outputs.cache-hit != 'true'
        run: |
          python -m pip install scons==4.9.1
          bash tools/build_web_engine.sh "$RUNNER_TEMP/dizzy-web-engine"
      - name: Publish browser bundle
        run: |
          dotnet workload install wasm-tools
          python tools/set_build_version.py "$GITHUB_RUN_NUMBER"
          dotnet build Dizzy.csproj --configuration Debug
          dotnet publish Dizzy.web --configuration Release -p:TwoDogRequireImport=true -p:TwoDogWebPrecompress=false \
            -p:TwoDogWebNativeDir="$RUNNER_TEMP/dizzy-web-engine/"
          # Give every deployment, including workflow reruns, its own runtime URLs.
          SITE=build/pages
          BUILD="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$SITE/builds"
          mv Dizzy.web/AppBundle "$SITE/builds/$BUILD"
          BUNDLE="$SITE/builds/$BUILD"
          mv "$BUNDLE/index.html" "$SITE/index.html"
          mv "$BUNDLE/engine-cache.js" "$SITE/"
          cp tools/pages-entry.html "$BUNDLE/index.html"
          cp tools/pages-entry.html "$SITE/404.html"
          cp -R gallery "$SITE/"
          cp "$BUNDLE"/{manifest.webmanifest,icon-*.png,favicon*,load.png} "$SITE/"
          mv "$BUNDLE/0-title.mp3" "$SITE/"
          jq --arg build "$BUILD" --slurpfile sizes "$BUNDLE/twodog.sizes.json" \
            '. + {build: $build, fileSizes: $sizes[0]}' "$BUNDLE/version.json" > "$SITE/version.json"
      - name: Test browser startup and PWA metadata
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          python -m http.server 8765 --directory build/pages > "$RUNNER_TEMP/dizzy-web.log" 2>&1 &
          node tools/web-smoke.cjs
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/pages

  pages:
    name: Deploy GitHub Pages
    needs: browser
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
