<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Dizzy</title>
<p>Page not found. <a id="home" href="../../">Open Dizzy</a></p>
<script>
    // GitHub Pages also serves this as 404.html for retired game URLs.
    const legacy = location.pathname.match(/^(.*\/)builds\/\d+-\d+\/(?:index\.html)?$/);
    if (legacy) {
        const root = new URL(legacy[1], location.href);
        root.search = location.search;
        root.hash = location.hash;
        // An old cached home page may still redirect straight back here.
        root.searchParams.set('_dizzy_home', Date.now());
        document.getElementById('home').href = root.href;
        location.replace(root);
    }
</script>
</html>
